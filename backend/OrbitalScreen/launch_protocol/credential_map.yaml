permission_scopes:
  read_public_docs:
    description: "Read access to public documentation"
    paths:
      - "README.md"
      - "LICENSE"
      - "docs/public/*"
    operations: ["read"]
  
  read_general_logs:
    description: "Read access to general system logs"
    paths:
      - "logs/general/*"
      - "logs/agent_activity/*"
    operations: ["read"]
  
  read_sensitive_logs:
    description: "Read access to sensitive logs"
    paths:
      - "logs/security/*"
      - "logs/credentials/*"
      - "logs/system/*"
    operations: ["read"]
    requires_clearance: "level_3_operator"
  
  write_agent_workspace:
    description: "Write access to agent's own workspace"
    paths:
      - "agents/${agent_id}/*"
    operations: ["read", "write", "create", "delete"]
    isolation: true
  
  modify_agent_workspace:
    description: "Modify other agent workspaces"
    paths:
      - "agents/*"
    operations: ["read", "write", "modify"]
    requires_clearance: "level_3_operator"
  
  commit_to_github:
    description: "Commit and push to GitHub repository"
    paths:
      - "*"
    operations: ["git_add", "git_commit", "git_push"]
    requires_clearance: "level_2_contributor"
    audit: true
  
  send_messages:
    description: "Send messages through communication bridge"
    operations: ["send_message"]
    requires_clearance: "level_2_contributor"
  
  broadcast_messages:
    description: "Broadcast messages to all agents"
    operations: ["broadcast_message"]
    requires_clearance: "level_3_operator"
    audit: true
  
  execute_scripts:
    description: "Execute system scripts"
    paths:
      - "backend/OrbitalScreen/launch_protocol/*.py"
      - "scripts/*"
    operations: ["execute"]
    requires_clearance: "level_3_operator"
    audit: true
  
  manage_credentials:
    description: "Manage agent credentials"
    paths:
      - "backend/OrbitalScreen/launch_protocol/credential_map.yaml"
    operations: ["read", "write", "modify"]
    requires_clearance: "level_4_commander"
    audit: true

credential_discipline:
  rules:
    - rule_id: "CD001"
      name: "No Credential Sharing"
      description: "Agents must not share credentials with other agents"
      enforcement: "automatic"
      violation_action: "immediate_suspension"
    
    - rule_id: "CD002"
      name: "Workspace Isolation"
      description: "Agents must operate only within their assigned workspace"
      enforcement: "automatic"
      violation_action: "access_denied"
    
    - rule_id: "CD003"
      name: "Audit Trail Required"
      description: "All privileged actions must be logged"
      enforcement: "automatic"
      violation_action: "action_blocked"
    
    - rule_id: "CD004"
      name: "Credential Expiration"
      description: "Expired credentials must be renewed or revoked"
      enforcement: "automatic"
      violation_action: "access_revoked"
    
    - rule_id: "CD005"
      name: "Least Privilege Principle"
      description: "Agents receive minimum permissions needed"
      enforcement: "manual_review"
      violation_action: "permission_reduction"
  
  monitoring:
    enabled: true
    log_file: "logs/credential_violations.log"
    alert_threshold: 3
    alert_recipients:
      - "seeker_commander"
      - "system_admin"
  
  audit_requirements:
    log_all_access: true
    log_all_modifications: true
    log_failed_attempts: true
    retention_days: 365

access_control_matrix:
  launch_protocol:
    read:
      - level_2_contributor
      - level_3_operator
      - level_4_commander
      - level_5_system
    write:
      - level_3_operator
      - level_4_commander
      - level_5_system
    execute:
      - level_3_operator
      - level_4_commander
      - level_5_system
  
  orientation_gate:
    read:
      - level_1_observer
      - level_2_contributor
      - level_3_operator
      - level_4_commander
      - level_5_system
    write:
      - level_4_commander
      - level_5_system
  
  agent_workspaces:
    read:
      - level_3_operator  # can read all
      - level_4_commander
      - level_5_system
    write:
      - level_2_contributor  # own workspace only
      - level_3_operator  # all workspaces
      - level_4_commander
      - level_5_system
  
  system_configuration:
    read:
      - level_3_operator
      - level_4_commander
      - level_5_system
    write:
      - level_4_commander
      - level_5_system
    execute:
      - level_5_system

lifecycle:
  onboarding:
    - step: "agent_arrival"
      action: "create_agent_profile"
      assigns: "level_1_observer"
    - step: "orientation_complete"
      action: "upgrade_clearance"
      assigns: "level_2_contributor"
    - step: "mission_briefing_complete"
      action: "assign_scoped_permissions"
      assigns: "mission_specific_permissions"
    - step: "launch_approved"
      action: "activate_full_permissions"
      assigns: "operational_status"
  
  operational:
    - action: "periodic_review"
      frequency: "monthly"
      reviewer: "level_4_commander"
    - action: "permission_audit"
      frequency: "weekly"
      automated: true
    - action: "credential_rotation"
      frequency: "quarterly"
      automated: false
  
  offboarding:
    - step: "graduation_initiated"
      action: "prepare_handoff"
      status: "transitioning"
    - step: "handoff_complete"
      action: "revoke_active_permissions"
      status: "graduated"
    - step: "archive_workspace"
      action: "move_to_archive"
      retention: "1_year"

emergency:
  credential_compromise:
    immediate_actions:
      - revoke_all_agent_credentials
      - lock_affected_workspaces
      - notify_commander
      - initiate_security_audit
    recovery_steps:
      - assess_damage
      - rotate_all_credentials
      - review_access_logs
      - update_security_protocols
  
  unauthorized_access:
    immediate_actions:
      - block_access
      - log_attempt
      - alert_security_team
      - preserve_evidence
    investigation:
      - review_access_logs
      - identify_breach_vector
      - assess_scope
      - implement_fixes

verification:
  enabled: true
  validation_script: "doctrinal_verification_log.py"
  check_frequency: "on_every_access"
  log_validations: true
  
status:
  operational: true
  last_validation: "2025-11-01T15:35:00Z"
  total_agents: 2
  active_agents: 1
  pending_agents: 1
