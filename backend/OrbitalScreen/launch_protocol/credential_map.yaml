metadata:
  version: "1.0.0"
  last_updated: "2025-11-01T15:35:00Z"
  updated_by: "agent_devin"
  mission: "Scaffold Cockpit Launch Protocol"
  commander: "Orbital"

clearance_levels:
  level_0_public:
    name: "Public Access"
    description: "Read-only access to public documentation"
    permissions:
      - read_public_docs
      - view_system_status
    restrictions:
      - no_write_access
      - no_sensitive_data
      - no_system_modification
  
  level_1_observer:
    name: "Observer"
    description: "Limited read access to non-sensitive areas"
    permissions:
      - read_public_docs
      - read_general_logs
      - view_system_status
      - view_agent_roster
    restrictions:
      - no_write_access
      - no_credential_access
      - no_system_modification
  
  level_2_contributor:
    name: "Contributor"
    description: "Standard agent access for operational tasks"
    permissions:
      - read_public_docs
      - read_general_logs
      - write_agent_workspace
      - send_messages
      - receive_messages
      - create_tasks
      - update_own_status
      - commit_to_github
    restrictions:
      - no_credential_modification
      - no_system_configuration
      - workspace_isolation
  
  level_3_operator:
    name: "Operator"
    description: "Enhanced access for mission-critical agents"
    permissions:
      - all_level_2_permissions
      - read_sensitive_logs
      - modify_agent_workspace
      - broadcast_messages
      - create_checkpoints
      - execute_scripts
      - manage_own_credentials
    restrictions:
      - no_other_agent_credentials
      - no_system_root_access
      - audited_actions
  
  level_4_commander:
    name: "Commander"
    description: "Full operational authority"
    permissions:
      - all_level_3_permissions
      - manage_all_agents
      - modify_credentials
      - system_configuration
      - approve_launches
      - initiate_handoffs
      - access_all_logs
      - emergency_override
    restrictions:
      - actions_logged
      - requires_justification
  
  level_5_system:
    name: "System Administrator"
    description: "Complete system access"
    permissions:
      - unrestricted_access
      - modify_clearance_levels
      - system_maintenance
      - security_management
      - audit_all_actions
    restrictions:
      - all_actions_logged
      - requires_multi_factor_auth

